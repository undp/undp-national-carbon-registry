name: Update Contributors Information

on:
  workflow_dispatch: {}
  schedule:
    # Weekly on Saturdays.
    - cron: "30 1 * * 6"
  push:
    branches: [main]

# `main` is protected and requires a reviewed pull request, so this workflow
# never pushes to it directly. Both steps below open a pull request instead,
# using the built-in GITHUB_TOKEN. No personal access token is required.
jobs:
  update-contributors:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Fills the <!-- readme: contributors -start/-end --> block in COMMUNITY.md.
      # The action edits the file through the GitHub API. When it detects that
      # the branch is protected it opens a pull request on its own.
      - name: Update contributor list
        id: contrib_list
        uses: akhilmhdh/contributors-readme-action@v2.3.10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          readme_path: COMMUNITY.md
          use_username: false
          commit_message: "docs: update contributors list"
          pr_title_on_protected: "docs: update contributors list"

      - name: Get contributors count
        id: get_contributors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONTRIBUTORS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --paginate \
            "/repos/$GITHUB_REPOSITORY/contributors?per_page=100" | \
            jq -s 'add | [.[] | select(.type != "Bot" and (.login | test("\\[bot\\]$") | not) and (.login | test("-bot$") | not))] | length')

          echo "Total contributors: $CONTRIBUTORS"
          echo "contributors=$CONTRIBUTORS" >> "$GITHUB_OUTPUT"

      - name: Update contributor count in COMMUNITY.md
        env:
          CONTRIBUTORS: ${{ steps.get_contributors.outputs.contributors }}
        run: |
          perl -i -pe 's/(<!--CONTRIBUTOR COUNT START-->).*?(<!--CONTRIBUTOR COUNT END-->)/$1 $ENV{CONTRIBUTORS} $2/' COMMUNITY.md
          git diff --stat

      # Opens (or updates) a pull request with the new count. Does nothing when
      # COMMUNITY.md is unchanged.
      - name: Open pull request with contributor count
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-contributor-count
          delete-branch: true
          commit-message: "docs: update contributor count to ${{ steps.get_contributors.outputs.contributors }}"
          title: "docs: update contributor count to ${{ steps.get_contributors.outputs.contributors }}"
          body: |
            Automated update of the contributor count in `COMMUNITY.md`.

            Generated by the [contributors workflow](.github/workflows/contributors.yml).
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
