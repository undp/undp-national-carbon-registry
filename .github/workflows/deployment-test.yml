name: Carbon Registry Test Deployment
on:
  push:
    branches:
      - '*'
    paths:
      - web/**
      - backend/**
      - .github/workflows/deployment*

env:
  REGISTRY: ${{ secrets.ACR_USERNAME }}.azurecr.io

jobs:
  changes:
    name: Deploy Pre Check
    runs-on: ubuntu-latest
    outputs:
      backend-changes: ${{ steps.changes.outputs.backend-changes }}
      all-changes: ${{ steps.changes.outputs.all-changes }}
      workflows-changes: ${{ steps.changes.outputs.workflows-changes }}
      frontend-changes: ${{ steps.changes.outputs.frontend-changes }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch_name || github.ref }}
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Determine changed services
        id: changes
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)

          if echo "$CHANGED_FILES" | grep -q "docker-"; then
            echo "All changes detected."
            echo "all-changes=true" >> $GITHUB_OUTPUT
          else
            echo "No All changes detected."
            echo "all-changes=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED_FILES" | grep -q ".github/workflows/"; then
            echo "Workflow changes detected."
            echo "workflows-changes=true" >> $GITHUB_OUTPUT
          else
            echo "No Workflow changes detected."
            echo "workflows-changes=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED_FILES" | grep -q "web/"; then
            echo "Frontend changes detected."
            echo "frontend-changes=true" >> $GITHUB_OUTPUT
          else
            echo "No Frontend changes detected."
            echo "frontend-changes=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED_FILES" | grep -q "backend/"; then
            echo "Backend changes detected."
            echo "backend-changes=true" >> $GITHUB_OUTPUT
          else
            echo "No Backend changes detected."
            echo "backend-changes=false" >> $GITHUB_OUTPUT
          fi

  build_frontend:
    name: Carbon Registry Frontend Build
    needs: changes
    if: needs.changes.outputs.frontend-changes == 'true' || needs.changes.outputs.workflows-changes == 'true' || needs.changes.outputs.all-changes == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-'frontend'
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 5
      - name: Check Docker variable changes
        run: |
          echo "docker-compose file Change...."
          git diff HEAD~ -- HEAD -z ./docker-compose*
      - name: Cache modules
        uses: actions/cache@v3
        id: yarn-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build, tag, and push the image to ACR
        id: build-image
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REPOSITORY: carbon-web
          IMAGE_TAG: ${{ github.head_ref || github.ref_name }}
        run: |
          # Build a docker container and push it to ACR 
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -f web/Dockerfile . --build-arg PORT=3030 --build-arg VITE_APP_BACKEND=http://localhost:3000 --build-arg VITE_APP_COUNTRY_NAME="CountryX" --build-arg VITE_APP_REGISTRY_NAME="CountryXRegistry" --build-arg VITE_APP_MAP_TYPE="Mapbox" --build-arg VITE_APP_MAPBOXGL_ACCESS_TOKEN=${{ secrets.MAPBOXGL_ACCESS_TOKEN }} --build-arg VITE_APP_MAXIMUM_FILE_SIZE=5242880 
          echo "Pushing image to ACR..."
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          echo "::set-output name=image::$REGISTRY/$REPOSITORY:$IMAGE_TAG"

  build_backend:
    name: Carbon Registry Backend Build
    needs: changes
    if: needs.changes.outputs.backend-changes == 'true' || needs.changes.outputs.workflows-changes == 'true' || needs.changes.outputs.all-changes == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-'backend'
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 5
      - name: Check Docker variable changes
        run: |
          echo "docker-compose file Change...."
          git diff HEAD~ -- HEAD -z ./docker-compose*
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build, tag, and push the image to ACR
        id: build-image
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REPOSITORY: carbon-services
          IMAGE_TAG: ${{ github.head_ref || github.ref_name }}
        run: |
          # Build a docker container and push it to ACR 
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -f backend/services/Dockerfile .
          echo "Pushing image to ACR..."
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          echo "::set-output name=image::$REGISTRY/$REPOSITORY:$IMAGE_TAG"

  deploy_frontend:
    name: Carbon Registry Frontend Deploy
    needs: build_frontend
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, registry-test]
    concurrency:
      group: registry-test-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy frontend on the Azure VM
        run: sudo /home/azureuser/carbon/dev_frontend_deploy.sh

  deploy_backend:
    name: Carbon Registry Backend Deploy
    needs: build_backend
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, registry-test]
    concurrency:
      group: registry-test-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy backend on the Azure VM
        run: sudo /home/azureuser/carbon/dev_backend_deploy.sh
